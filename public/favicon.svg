<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#0b2419"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8b6"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#9a762c"/>
    </linearGradient>
  </defs>

  <!-- Latar Belakang Hijau Zamrud Warisan -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.85"/>

  <!-- Tunjuk Langit / Puncak Bumbung Tradisi -->
  <path d="M32 7.5 L33.5 12 L30.5 12 Z" fill="url(#gold)"/>
  <line x1="32" y1="6.5" x2="32" y2="14" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Bumbung Utama Rumah Melayu Klasik -->
  <path d="M32 13 L11 27 L14.5 29.5 L32 17.5 L49.5 29.5 L53 27 Z" fill="url(#gold)"/>
  
  <!-- Tebar Layar / Segitiga Hadapan -->
  <polygon points="32,18.5 18,28 46,28" fill="#fae8b6" opacity="0.28"/>
  <polygon points="32,20 22,27 42,27" fill="url(#gold)" opacity="0.85"/>

  <!-- Bumbung Sayap Kiri & Kanan (Eaves) -->
  <path d="M13 28.5 L6 33.5 L8.5 35.2 L14 31 Z" fill="url(#gold)"/>
  <path d="M51 28.5 L58 33.5 L55.5 35.2 L50 31 Z" fill="url(#gold)"/>

  <!-- Struktur Dinding Rumah Kayu Jati -->
  <rect x="16" y="29.5" width="32" height="16" rx="1.5" fill="#143628" stroke="url(#gold)" stroke-width="1.6"/>
  
  <!-- Tingkap Kayu Klasik -->
  <rect x="19" y="33" width="5.5" height="7" rx="0.75" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="21.75" y1="33" x2="21.75" y2="40" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="19" y1="36.5" x2="24.5" y2="36.5" stroke="url(#gold)" stroke-width="0.9"/>

  <rect x="39.5" y="33" width="5.5" height="7" rx="0.75" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="42.25" y1="33" x2="42.25" y2="40" stroke="url(#gold)" stroke-width="0.9"/>
  <line x1="39.5" y1="36.5" x2="45" y2="36.5" stroke="url(#gold)" stroke-width="0.9"/>

  <!-- Pintu Masuk Rumah Tradisi -->
  <rect x="28.5" y="32.5" width="7" height="13" rx="1" fill="url(#gold)"/>
  <circle cx="34" cy="39" r="0.8" fill="#1b4332"/>

  <!-- Tiang Rumah Panggung Melayu -->
  <line x1="18" y1="45.5" x2="18" y2="55" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="45.5" x2="26" y2="55" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="45.5" x2="38" y2="55" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="45.5" x2="46" y2="55" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Tangga / Anak Tangga Warisan -->
  <line x1="28" y1="48" x2="36" y2="48" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="51.5" x2="37" y2="51.5" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="26" y1="55" x2="38" y2="55" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
</svg>